services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-multirealm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak-multirealm-auth
    restart: unless-stopped
    command: start-dev --http-port 8180
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak-multirealm-init
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-keycloak.sh"]
    volumes:
      - ./docker/keycloak/init-keycloak.sh:/init/init-keycloak.sh:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycloak-multirealm-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenants_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KEYCLOAK_BASE_URL: http://localhost:8180
      KEYCLOAK_SERVER_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_CLIENT_ID: tenant-provisioner
      KEYCLOAK_ADMIN_CLIENT_SECRET: admin-client-secret
      SUPER_ADMIN_REALM: platform
      BASE_DOMAIN: app.example.com
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080,https://*.app.example.com
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
